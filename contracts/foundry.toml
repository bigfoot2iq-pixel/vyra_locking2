[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./data" }]

[fuzz]
runs = 512

[rpc_endpoints]
ink = "https://rpc-gel.inkonchain.com"
ink_sepolia = "https://rpc-gel-sepolia.inkonchain.com"

[etherscan]
ink = { key = "blockscout", chain = 57073, url = "https://explorer.inkonchain.com/api/" }
ink_sepolia = { key = "blockscout", chain = 763373, url = "https://explorer-sepolia.inkonchain.com/api/" }
